{% extends "admin/layout.html" %}{% block body %}<h1>Admin login</h1>
{% if err %}<p class="err" role="alert">{{ err }}</p>{% endif %}
<form method="post" class="card form" autocomplete="off"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Username<input name="username" required maxlength="60" autofocus></label><label>Password<input type="password" name="password" required maxlength="200"></label><button class="btn">Log in</button></form>{% endblock %}
