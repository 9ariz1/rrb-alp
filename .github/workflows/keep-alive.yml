
name: Keep Render Website Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render website
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://rrb-alp.onrender.com/login \
            -o /dev/null
